<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#00ff66" />
        </linearGradient>
    </defs>
    
    <!-- Sfondo scuro terminale -->
    <rect width="100" height="100" fill="#060f0b" rx="20"/>
    
    <!-- Bordo hacker -->
    <rect x="3" y="3" width="94" height="94" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" rx="17" />
    
    <g filter="url(#glow)">
        <!-- Lettera A -->
        <path d="M 42.5 75 L 30 25 L 17.5 75" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M 23 58 L 37 58" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="square"/>
        
        <!-- Lettera C -->
        <path d="M 82.5 25 L 57.5 25 L 57.5 75 L 82.5 75" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
        
        <!-- Dettagli Pixel / Prompt -->
        <rect x="74.5" y="67" width="8" height="8" fill="#00ff66"/>
        <rect x="17.5" y="25" width="8" height="8" fill="#10b981"/>
    </g>
</svg>
